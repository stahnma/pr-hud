# Private backend behind stahnma-edge (github.com/stahnma/stahnma-edge),
# served at https://prs.stahnma.us with GitHub sign-in. This app has only a
# Flycast address, so the edge is the only way in:
#   fly ips allocate-v6 --private -a stahnma-pr-hud
# GITHUB_TOKEN is a fly secret.
app = "stahnma-pr-hud"
primary_region = "ord"

[env]
  LISTEN_ADDR = "0.0.0.0"
  PORT = "8080"

[http_service]
  internal_port = 8080
  # The edge talks plain HTTP over Flycast; TLS ends at the edge.
  force_https = false
  # The cache is in memory; keep the machine up so it stays warm.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
